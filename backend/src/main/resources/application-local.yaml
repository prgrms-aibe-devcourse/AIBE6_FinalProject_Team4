spring:
  jpa:
    # ddl-auto is already "update" by default (see application.yaml) — nothing to override here.
    show-sql: true

logging:
  level:
    com.kiwobollae.api: DEBUG

app:
  seed:
    gacha:
      enabled: true
    gacha-pack:
      enabled: true
    charge-product:
      enabled: true
    product:
      enabled: true
    card:
      enabled: true
    plant-profile:
      # Seeds sample plant profiles for the InitData test users, so /plants isn't
      # empty on a fresh local DB. Depends on InitData (users) and ProductInitData
      # (plant speciegit s) having already run — see @Order on PlantProfileInitData.
      enabled: true
    journal:
      # Seeds sample journal entries (with placeholder images) for whichever plant
      # profiles exist, so /journals isn't empty while real journal creation is
      # still blocked on image upload. Depends on PlantProfileInitData having run.
      enabled: true
    notification:
      # Seeds one sample alert per NotificationType for each InitData test user,
      # so the notification bell/목록/설정 화면 isn't empty on a fresh local DB.
      enabled: true
    point-scenario:
      # Seeds test@test.com's point history with admin adjustments, a mixed-point
      # order and cancellation, a mixed-point card purchase, and two journal rewards.
      # The resulting free-point balance is 400P and seed activity times follow the
      # relative journal dates instead of the server startup time.
      # Charge/refund history is created through Toss Payments test transactions.
      enabled: true
    board:
      # Seeds sample board posts/comments (including a reply-to-reply thread) for
      # the InitData test users, so /board isn't empty on a fresh local DB.
      enabled: true
