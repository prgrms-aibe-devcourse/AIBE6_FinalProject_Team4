spring:
  jpa:
    # ddl-auto is already "update" by default (see application.yaml) — nothing to override here.
    show-sql: true

logging:
  level:
    com.kiwobollae.api: DEBUG

app:
  seed:
    charge-product:
      enabled: true
    product:
      # Set to false when local development should use manually managed or production-like data.
      enabled: true
    card:
      # Seeds ten cards and their exchange products only when both tables are empty.
      enabled: true
