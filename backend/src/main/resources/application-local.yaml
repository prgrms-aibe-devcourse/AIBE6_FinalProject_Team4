spring:
  jpa:
    # ddl-auto is already "update" by default (see application.yaml) — nothing to override here.
    show-sql: true

logging:
  level:
    com.kiwobollae.api: DEBUG

app:
  gacha:
    qa:
      enabled: true
      # TEMP(QA): COMMON 10%p를 GOLDEN에 이전. 테스트 종료 후 false로 바꿔 즉시 원복한다.
      golden-rate-boost-enabled: true
  seed:
    gacha:
      enabled: true
    gacha-qa:
      enabled: true
    charge-product:
      enabled: true
    product:
      enabled: true
    card:
      enabled: true
