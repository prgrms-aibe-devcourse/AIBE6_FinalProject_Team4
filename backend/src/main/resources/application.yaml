spring:
  application:
    name: api
  # Default active profile so a plain `bootRun`/IDE run works without extra setup.
  # Real deployments override this via the SPRING_PROFILES_ACTIVE env var (env vars win
  # over values in this file), so this default never leaks into prod.
  profiles:
    active: local
  # Local secrets file (gitignored). Copy application-secret.yaml.example -> application-secret.yaml
  # and fill in real values; if the file doesn't exist this import is silently skipped and the
  # ${ENV_VAR:default} placeholders below (or actual env vars, e.g. in CI/prod) are used instead.
  config:
    import: optional:classpath:application-secret.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/kiwobollae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    hikari:
      # DB 함수(CURRENT_TIMESTAMP)가 애플리케이션 감사 시각과 같은 Asia/Seoul 기준을 사용하도록
      # 모든 풀 연결이 생성될 때 세션 시간대를 고정한다.
      connection-init-sql: SET time_zone = '+09:00'
  jpa:
    hibernate:
      # Default to "update" for convenience while there's no migration tool yet (see
      # docs/erd.dbml for the schema this should eventually match exactly). The prod profile
      # (application-prod.yaml) overrides this back to "validate" so a real deployment never
      # silently alters the schema. Follow-up: introduce Flyway or Liquibase and drop ddl-auto
      # entirely.
      ddl-auto: create
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_dev_only_placeholder_secret}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  asset:
    # 카드·쿠폰·상품 정적 자산의 base URL. cards/, coupons/, products/ 프리픽스를 퍼블릭 read로 둔다.
    # CloudFront로 옮기게 되면 이 값만 그 도메인으로 바꾸면 된다(imageKey는 그대로 재사용).
    base-url: ${ASSET_BASE_URL:https://${aws.s3.bucket}.s3.${aws.s3.region}.amazonaws.com}
  cookie:
    # Secure 속성은 HTTPS에서만 쿠키를 전송하게 강제함. 로컬 http 개발 환경에서는 false로 둠.
    secure: ${COOKIE_SECURE:false}
  mail:
    # false(기본값)면 실제 발송 대신 콘솔 로그로만 인증코드를 남김(LoggingEmailSender).
    # 실제 SMTP로 발송하려면 true로 두고 아래 값을 application-secret.yaml에 채울 것.
    # (spring.mail.* 자동설정 대신 MailConfig에서 JavaMailSenderImpl을 직접 구성한다.)
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@kiwobollae.com}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    smtp-auth: ${MAIL_SMTP_AUTH:true}
    starttls: ${MAIL_STARTTLS:true}
  oauth:
    # 각 provider 콘솔에서 발급받은 값. 비어 있으면 해당 provider로 로그인 시도 시 provider가
    # 요청을 거부해 AUTH_OAUTH_AUTHENTICATION_FAILED로 이어진다(기동 자체는 막지 않음).
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/callback/google}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/callback/kakao}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:3000/oauth/callback/naver}

payment:
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}

ai:
  image:
    # DB에는 host-relative 경로를 저장하고, OpenAI 호출 직전에 이 공개 주소를 붙인다.
    # 텍스트 기능은 값 없이 사용할 수 있지만 이미지 기능 호출 시에는 필수다.
    public-base-url: ${AI_IMAGE_PUBLIC_BASE_URL:}
  openai:
    # API Key와 모델은 코드에 기본값을 두지 않는다. 값이 없으면 기존 기능은 정상 기동하고,
    # 실제 AI 호출만 AI_CONFIGURATION_INVALID로 거부한다.
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    text-model: ${OPENAI_TEXT_MODEL:}
    vision-model: ${OPENAI_VISION_MODEL:}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:30s}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2000}
  policy:
    # MVP 기본값이며 운영 사용량을 확인한 뒤 환경변수로 조정한다.
    max-input-length: ${AI_MAX_INPUT_LENGTH:2000}
    rate-limit:
      max-requests: ${AI_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${AI_RATE_LIMIT_WINDOW:1m}
    # 모든 사용자·기능이 공유하는 실제 외부 AI 호출 상한이다. 캐시 히트는 소모하지 않는다.
    # 운영 비용 한도에 맞게 두 환경변수를 반드시 조정한다.
    global-rate-limit:
      max-requests: ${AI_GLOBAL_RATE_LIMIT_MAX_REQUESTS:100}
      window: ${AI_GLOBAL_RATE_LIMIT_WINDOW:1d}

aws:
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:4team-storage-495264909330-ap-northeast-2-an}
    # 비워두면 SDK 기본 자격증명 체인(환경변수, ~/.aws/credentials, IAM Role 등)을 사용한다.
    # 로컬 개발에서 IAM 사용자 키를 쓰려면 application-secret.yaml에 값을 채울 것.
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
