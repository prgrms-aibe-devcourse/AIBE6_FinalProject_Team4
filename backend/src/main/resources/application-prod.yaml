spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    # local과 동일한 이유(위 application-local.yaml 주석 참고) — ddl-auto: update가
    # 스키마를 먼저 맞춘 뒤에 시드 SQL이 실행되도록 순서를 뒤집는다.
    defer-datasource-initialization: true
  sql:
    init:
      # 기존 InitData류 ApplicationRunner의 @Profile({"local","prod"}) 대체. 정액 충전
      # 상품(charge_products)은 직접 금액 충전으로 대체되며 테이블 자체가 사라졌다.
      mode: always
      data-locations: classpath:dev-seed-data.sql

management:
  endpoints:
    web:
      exposure:
        # prometheus는 k6 부하 테스트용 로컬 전용 엔드포인트(SecurityConfig에서 permitAll)라
        # 운영에는 노출하지 않는다 — 공통 설정(application.yaml)의 include를 여기서 다시 좁힘.
        include: health

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:https://kiwor.site,https://www.kiwor.site}
  cookie:
    secure: ${COOKIE_SECURE:true}
  mail:
    # 운영은 기본값 없이 명시적으로 true를 요구 — 설정을 빠뜨리면 기동 자체가 실패해서
    # "이메일이 콘솔에만 찍히고 실제로는 안 나가는" 상태로 조용히 배포되는 걸 막는다.
    enabled: ${MAIL_ENABLED}
    from: ${MAIL_FROM}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      redirect-uri: ${NAVER_REDIRECT_URI}
  seed:
    # 옛 InitData 계열이 만들던 테스트 계정/샘플 데이터는 이제 dev-seed-data.sql로 들어간다
    # (spring.sql.init 설정 참고) — ddl-auto: update처럼 배포 편의를 위한 임시 조치이며,
    # 실제 서비스 오픈 전에는 반드시 spring.sql.init.mode를 꺼야 한다.

payment:
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    connect-timeout: ${TOSS_PAYMENTS_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOSS_PAYMENTS_READ_TIMEOUT:30s}
    reconciliation-read-timeout: ${TOSS_PAYMENTS_RECONCILIATION_READ_TIMEOUT:5s}
    bulkhead:
      max-concurrent-calls: ${TOSS_PAYMENTS_MAX_CONCURRENT_CALLS:10}
      acquire-timeout: ${TOSS_PAYMENTS_ACQUIRE_TIMEOUT:100ms}
    circuit-breaker:
      failure-threshold: ${TOSS_PAYMENTS_FAILURE_THRESHOLD:5}
      open-duration: ${TOSS_PAYMENTS_CIRCUIT_OPEN_DURATION:30s}
