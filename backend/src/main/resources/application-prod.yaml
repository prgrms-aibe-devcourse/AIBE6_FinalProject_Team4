spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        # prometheus는 k6 부하 테스트용 로컬 전용 엔드포인트(SecurityConfig에서 permitAll)라
        # 운영에는 노출하지 않는다 — 공통 설정(application.yaml)의 include를 여기서 다시 좁힘.
        include: health

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:https://kiwor.site,https://www.kiwor.site}
  cookie:
    secure: ${COOKIE_SECURE:true}
  mail:
    # 운영은 기본값 없이 명시적으로 true를 요구 — 설정을 빠뜨리면 기동 자체가 실패해서
    # "이메일이 콘솔에만 찍히고 실제로는 안 나가는" 상태로 조용히 배포되는 걸 막는다.
    enabled: ${MAIL_ENABLED}
    from: ${MAIL_FROM}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      redirect-uri: ${NAVER_REDIRECT_URI}
  seed:
    # InitData 계열(@Profile로 local과 prod 모두에서 실행)이 만드는 테스트
    # 계정(admin/test/user@test.com)과 샘플 상품·카드·식물·일지·알림이 운영 DB에도
    # 그대로 들어간다 — ddl-auto: update처럼 배포 편의를 위한 임시 조치. 실제 서비스
    # 오픈 전에는 반드시 false로 되돌리거나 이 블록 자체를 지울 것.
    gacha:
      enabled: true
    gacha-pack:
      enabled: true
    product:
      enabled: true
    card:
      enabled: true
    plant-profile:
      enabled: true
    journal:
      enabled: true
    notification:
      enabled: true
    board:
      enabled: true

payment:
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    connect-timeout: ${TOSS_PAYMENTS_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOSS_PAYMENTS_READ_TIMEOUT:30s}
    reconciliation-read-timeout: ${TOSS_PAYMENTS_RECONCILIATION_READ_TIMEOUT:5s}
    bulkhead:
      max-concurrent-calls: ${TOSS_PAYMENTS_MAX_CONCURRENT_CALLS:10}
      acquire-timeout: ${TOSS_PAYMENTS_ACQUIRE_TIMEOUT:100ms}
    circuit-breaker:
      failure-threshold: ${TOSS_PAYMENTS_FAILURE_THRESHOLD:5}
      open-duration: ${TOSS_PAYMENTS_CIRCUIT_OPEN_DURATION:30s}
